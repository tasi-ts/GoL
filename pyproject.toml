[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gol"
version = "0.1.0"
description = "Conway's Game of Life with bounded, toroidal, and geodesic sphere topologies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pygame-ce>=2.5.0",
]

[project.scripts]
gol = "gol.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["gol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: isolated unit tests",
    "integration: multi-module engine tests",
    "e2e: pygame UI tests (dummy video driver)",
]

[tool.ruff]
target-version = "py311"
src = ["gol", "tests"]

[tool.ruff.lint]
# Classic pyflakes + pycodestyle errors. Broader rules wait for later PRs.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Language level 3.12 is required to parse current numpy stubs (`type` aliases).
# Runtime support remains Python 3.11+ (CI matrix 3.11 and 3.12).
python_version = "3.12"
packages = ["gol"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true

# Engine modules: catch untyped public (and private) defs. UI stays looser
# because pygame-ce stubs are incomplete for drawing/event code.
[[tool.mypy.overrides]]
module = [
    "gol.board",
    "gol.game",
    "gol.rules",
    "gol.geodesic_board",
    "gol.geodesic_mesh",
    "gol.topology",
    "gol.seeding",
    "gol.types",
    "gol.patterns",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "gol.ui.*"
disallow_untyped_defs = false

# pygame drawing and the console launcher are omitted so the floor measures
# the engine (boards, rules, game, mesh, topology, seeding).
[tool.coverage.run]
source = ["gol"]
omit = [
    "gol/ui/*",
    "gol/cli.py",
    "gol/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
